[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "refmb"
version = "0.8.0"
description = "Score a human gut metagenome against a healthy-adult reference baseline measured the same way (assembly-based or read-based pipeline)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "[TBD]" }]
keywords = ["metagenomics", "microbiome", "reference", "MetaPhlAn", "MGnify", "percentile"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "scipy>=1.11,<2",
  "pyarrow>=14,<26",
  "pyyaml>=6,<7",
  "tabulate>=0.9,<1",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
refmb = "refmb.cli:main"

[project.urls]
Repository = "https://github.com/khoa-yelo/Meta2"

[tool.hatch.build.targets.wheel]
packages = ["src/refmb"]

[tool.hatch.build.targets.sdist]
include = ["src/refmb", "README.md", "LICENSE", "pyproject.toml", "CHANGELOG.md", "CITATION.cff", "tests", "docs", "examples"]
exclude = ["docs/reports/*.tsv"]   # hatchling always ships .gitignore in an sdist

[tool.pytest.ini_options]
testpaths = ["tests"]
