name: tests

on:
  push:
    paths: ["checkgm/**", ".github/workflows/test.yml"]
  pull_request:
    paths: ["checkgm/**", ".github/workflows/test.yml"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: checkgm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      # figures too: matplotlib is an optional extra, but the figure that 'assess' draws is shipped behaviour and has
      # to be exercised. The suite also has to pass without it, which the no-matplotlib job below checks.
      - run: pip install -e ".[test,figures]"
      - run: checkgm --version
      - run: pytest -q

  pytest-without-matplotlib:
    # 'assess' promises to write its tables and skip the figure when matplotlib is absent. That promise is only worth
    # anything if it is tested in an environment that genuinely lacks it.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: checkgm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - run: python -c "import importlib.util, sys; sys.exit(1 if importlib.util.find_spec('matplotlib') else 0)"
      - run: pytest -q
